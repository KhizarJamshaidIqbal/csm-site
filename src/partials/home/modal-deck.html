  <!-- ====================================================================
       MODAL 2: INVESTOR PITCH DECK REQUEST MODAL
  ==================================================================== -->
  <div id="deck-modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="deck-title">
    <div class="glass-card rounded-2xl border border-white/15 max-w-md w-full p-6 sm:p-8 relative shadow-2xl bg-[#090D18]">
      
      <button id="close-deck-btn" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1" aria-label="Close Modal">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- Form View -->
      
<form id="deck-form" class="space-y-4">
        <div class="text-center mb-6">
          <div class="w-10 h-10 rounded-xl bg-purple-500/10 border border-purple-500/20 flex items-center justify-center text-purple-400 mx-auto mb-3">
            <i data-lucide="file-text" class="w-5 h-5"></i>
          </div>
          <h4 id="deck-title" class="text-xl font-bold text-white">Request Confidential Pitch Deck</h4>
          <p class="text-xs text-slate-400 mt-1">CSM Seed Round • Financial Model • 317 MCP Tools Architecture</p>
        </div>

        <div>
          <label for="deck-fund" class="text-xs font-semibold text-slate-300 block mb-1">Fund or Angel Name</label>
          <input id="deck-fund" type="text" required placeholder="e.g. Founders Fund / Khosla / Angel" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-white/10 text-white text-xs placeholder-slate-500 focus:outline-none focus:border-purple-400 font-mono">
        </div>

        <div>
          <label for="deck-email" class="text-xs font-semibold text-slate-300 block mb-1">Investor Email Address</label>
          <input id="deck-email" type="email" required placeholder="partner@fund.com" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-white/10 text-white text-xs placeholder-slate-500 focus:outline-none focus:border-purple-400 font-mono">
        </div>

        <div aria-live="polite" class="form-error hidden p-3 rounded-lg bg-red-950/40 border border-red-500/30 text-red-300 text-xs leading-relaxed"></div>

        <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-purple-600 to-indigo-600 hover:opacity-95 text-white font-bold text-xs shadow-lg transition-all mt-4">
          Access Pitch Deck
        </button>
      </form>

      <!-- Success View -->
      
<div id="deck-success" class="hidden text-center py-6 space-y-4">
        <div class="w-14 h-14 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center mx-auto mb-2">
          <i data-lucide="check" class="w-8 h-8"></i>
        </div>
        <h4 class="text-xl font-bold text-white">Investor Request Received</h4>
        <p class="text-xs text-slate-300">
          Request received. The founder team will send the confidential pitch summary and data room link to the email you provided.
        </p>

        <button id="deck-success-close" class="w-full py-2.5 rounded-lg bg-white/10 text-white font-semibold text-xs hover:bg-white/20 transition-all">
          Return to Site
        </button>
      </div>

    </div>
  </div>
