  <!-- ====================================================================
       MODAL 1: EARLY ACCESS & INVESTOR WAITLIST MODAL
  ==================================================================== -->
  
<div id="waitlist-modal" class="hidden fixed inset-0 z-50 modal-backdrop flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-labelledby="waitlist-title">
    <div class="glass-card rounded-2xl border border-white/15 max-w-md w-full p-6 sm:p-8 relative shadow-2xl bg-[#090D18]">
      
      <!-- Close button -->
      <button id="close-waitlist-btn" class="absolute top-4 right-4 text-slate-400 hover:text-white p-1" aria-label="Close Modal">
        <i data-lucide="x" class="w-5 h-5"></i>
      </button>

      <!-- Form View -->
      <form id="waitlist-form" class="space-y-4">
        <!-- Honeypot anti-spam field (hidden from humans) -->
        <input type="checkbox" name="botcheck" class="hidden" style="display: none;" tabindex="-1" autocomplete="off">
        <div class="text-center mb-6">
          <div class="w-10 h-10 rounded-xl bg-cyan-500/10 border border-cyan-500/20 flex items-center justify-center text-cyan-400 mx-auto mb-3">
            <i data-lucide="sparkles" class="w-5 h-5"></i>
          </div>
          <h4 id="waitlist-title" class="text-xl font-bold text-white">Join Early Access Waitlist</h4>
          <p class="text-xs text-slate-400 mt-1">Get priority alpha MCP API access & founder updates</p>
        </div>

        <!-- Role Radio Selector -->
        
<div>
          <label class="text-xs font-semibold text-slate-300 block mb-2">I am applying as a:</label>
          <div class="grid grid-cols-3 gap-2 text-center text-xs font-mono">
            <label class="p-2 rounded-lg border border-white/10 bg-white/5 cursor-pointer has-[:checked]:border-cyan-400 has-[:checked]:bg-cyan-950/40">
              <input type="radio" name="user_role" value="investor" class="sr-only">
              <span class="block font-semibold">VC / Angel</span>
            </label>
            <label class="p-2 rounded-lg border border-white/10 bg-white/5 cursor-pointer has-[:checked]:border-cyan-400 has-[:checked]:bg-cyan-950/40">
              <input type="radio" name="user_role" value="builder" checked class="sr-only">
              <span class="block font-semibold">AI Builder</span>
            </label>
            <label class="p-2 rounded-lg border border-white/10 bg-white/5 cursor-pointer has-[:checked]:border-cyan-400 has-[:checked]:bg-cyan-950/40">
              <input type="radio" name="user_role" value="merchant" class="sr-only">
              <span class="block font-semibold">Brand Owner</span>
            </label>
          </div>
        </div>

        <div>
          <label for="wl-name" class="text-xs font-semibold text-slate-300 block mb-1">Full Name</label>
          <input id="wl-name" type="text" required placeholder="Satya Nadella" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-white/10 text-white text-xs placeholder-slate-500 focus:outline-none focus:border-cyan-400 font-mono">
        </div>

        
<div>
          <label for="wl-email" class="text-xs font-semibold text-slate-300 block mb-1">Work Email</label>
          <input id="wl-email" type="email" required placeholder="satya@venture.com" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-white/10 text-white text-xs placeholder-slate-500 focus:outline-none focus:border-cyan-400 font-mono">
        </div>

        <div>
          <label for="wl-company" class="text-xs font-semibold text-slate-300 block mb-1">Company / Venture Fund</label>
          <input id="wl-company" type="text" placeholder="Sequoia / Independent / Studio" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-white/10 text-white text-xs placeholder-slate-500 focus:outline-none focus:border-cyan-400 font-mono">
        </div>

        <div>
          <label for="wl-builder" class="text-xs font-semibold text-slate-300 block mb-1">Primary Frontend Builder</label>
          <select id="wl-builder" class="w-full px-3.5 py-2.5 rounded-lg bg-slate-900 border border-white/10 text-white text-xs focus:outline-none focus:border-cyan-400 font-mono">
            <option value="lovable">Lovable.dev</option>
            <option value="v0">v0 by Vercel</option>
            <option value="bolt">Bolt.new</option>
            <option value="cursor">Cursor / Claude Code</option>
            <option value="nextjs">Custom Next.js / React</option>
            <option value="investor">N/A (Evaluating as Investor)</option>
          </select>
        </div>

        <div aria-live="polite" class="form-error hidden p-3 rounded-lg bg-red-950/40 border border-red-500/30 text-red-300 text-xs leading-relaxed"></div>

        <button type="submit" class="w-full py-3 rounded-xl bg-gradient-to-r from-cyan-500 via-indigo-500 to-purple-600 hover:opacity-95 text-white font-bold text-xs shadow-lg transition-all mt-4">
          Reserve Priority Spot
        </button>
      </form>

      
<!-- Success View -->
      <div id="waitlist-success" class="hidden text-center py-6 space-y-4">
        <div class="w-14 h-14 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-400 flex items-center justify-center mx-auto mb-2">
          <i data-lucide="check" class="w-8 h-8"></i>
        </div>
        <h4 class="text-xl font-bold text-white">Request Received!</h4>
        <p class="text-xs text-slate-300">
          Your priority ticket has been reserved. Our team will reach out at the email you provided with confirmation and the developer onboarding packet.
        </p>

        <div class="p-4 rounded-xl bg-cyan-950/40 border border-cyan-500/30 text-center font-mono my-4">
          <span class="text-xs text-slate-400 block mb-1">YOUR SPOT IS RESERVED</span>
          <span id="waitlist-ticket-number" class="text-2xl font-extrabold text-cyan-300">✓ Confirmed</span>
        </div>

        <button id="waitlist-success-close" class="w-full py-2.5 rounded-lg bg-white/10 text-white font-semibold text-xs hover:bg-white/20 transition-all">
          Close Window
        </button>
      </div>

    </div>
  </div>
