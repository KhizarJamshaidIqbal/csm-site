<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" class="w-full h-full">
  <defs>
    <linearGradient id="csm-grad-primary" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <linearGradient id="csm-grad-glow" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.2" />
    </linearGradient>
    <filter id="csm-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Glow Hex / Shield -->
  <path d="M24 4L41.32 14V34L24 44L6.68 34V14L24 4Z" 
        stroke="url(#csm-grad-primary)" 
        stroke-width="2.5" 
        stroke-linejoin="round" 
        fill="#0B0F19" 
        fill-opacity="0.9" />

  <!-- Inner Dynamic Circuit Nodes -->
  <circle cx="24" cy="12" r="3" fill="#38BDF8" />
  <circle cx="34" cy="24" r="3" fill="#8B5CF6" />
  <circle cx="24" cy="36" r="3" fill="#EC4899" />
  <circle cx="14" cy="24" r="3" fill="#06B6D4" />
  <circle cx="24" cy="24" r="4.5" fill="url(#csm-grad-primary)" filter="url(#csm-blur)" />

  <!-- Connecting Bus Lines -->
  <path d="M24 12V24M24 24V36M14 24H24M24 24H34" 
        stroke="url(#csm-grad-primary)" 
        stroke-width="2" 
        stroke-linecap="round" />
  <path d="M14 24L24 12L34 24L24 36L14 24Z" 
        stroke="#8B5CF6" 
        stroke-width="1.2" 
        stroke-dasharray="2 3" 
        stroke-opacity="0.7" />
</svg>
